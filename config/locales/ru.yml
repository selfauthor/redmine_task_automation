ru:
  # Название плагина
  plugin_redmine_task_automation: "Автоматизация задач Redmine"

  # Label для пункта меню
  label_task_automation: "Автоматизация задач"

  task_automation:
    # Заголовок страницы настроек
    settings_title: "Настройки автоматизации задач"

    # Секции настроек
    settings:
      section_main: "Основные настройки"
      section_actions: "Действия"
      section_test_results: "Результаты тестирования"
      section_last_run: "Последний запуск (журнал)"

      select_project: "-- Выберите проект --"
      select_user: "-- Выберите пользователя --"
      select_tracker: "-- Выберите трекер --"
      run_now_hint: "Запустит обработку всех задач-шаблонов немедленно"

      source_project_id: "Проект с шаблонами задач"
      source_project_hint: "ID проекта, в котором хранятся задачи-шаблоны"
      author_id: "Автор создаваемых задач"
      author_hint: "ID пользователя, который будет указан как автор"
      tracker_id: "Трекер основных задач"
      tracker_hint: "ID трекера для создаваемых основных задач"

      subtask_tracker_id: "Трекер подзадач"
      subtask_tracker_hint: "ID трекера, который будет использоваться для создаваемых подзадач"

    # Кнопки
    buttons:
      save: "Сохранить"
      save_hint: "Сохраняет текущие настройки плагина в базу данных"
      test: "Тестировать"
      test_hint: "Проверяет корректность настроек: наличие проекта, пользователя, трекера и всех необходимых кастомных полей"
      run_now: "Запустить сейчас"
      run_now_hint: "Запускает немедленную обработку всех задач-шаблонов. Создаёт новые задачи на основе шаблонов, у которых подошла дата выполнения"
      clear_test_results: "Очистить результаты тестирования"

    # Сообщения flash
    flash:
      settings_saved: "Настройки успешно сохранены"
      settings_save_error: "Ошибка сохранения настроек: %{error}"
      run_success: "Обработка завершена успешно. Создано %{issues} задач и %{subtasks} подзадач"
      run_with_errors: "Обработка завершена с ошибками. Создано %{issues} задач, ошибок: %{errors}"
      run_error: "Критическая ошибка при запуске: %{error}"
      test_results_cleared: "Результаты тестирования очищены"

    # Сообщения валидации
    validation:
      source_project_required: "Проект с шаблонами задач обязателен для заполнения"
      source_project_not_found: "Указанный проект с шаблонами не найден"
      author_required: "Автор создаваемых задач обязателен для заполнения"
      author_not_found: "Указанный автор не найден"
      tracker_required: "Трекер основных задач обязателен для заполнения"
      tracker_not_found: "Указанный трекер основных задач не найден"
      subtask_tracker_required: "Трекер подзадач обязателен для заполнения"
      subtask_tracker_not_found: "Указанный трекер подзадач не найден"
      date_field_not_found: "Кастомное поле 'Дата следующего выполнения' не найдено"

    # Подтверждения действий
    confirm:
      test: "Вы уверены, что хотите протестировать настройки?"
      run_now: "Вы уверены, что хотите запустить обработку задач вручную? Это может занять некоторое время."

    # Тестирование
    test:
      tracker_in_project: "Трекер доступен в проекте-источнике"
      tracker_not_in_project: "Трекер НЕ доступен в проекте-источнике"
      author_has_permissions: "Пользователь имеет права на чтение и редактирование задач"
      fields_available_for_tracker: "Все необходимые поля доступны для выбранного трекера"
      fields_not_available_for_tracker: "Поля недоступны для трекера: %{fields}"
      custom_field_types_correct: "Типы всех кастомных полей корректны"
      custom_field_type_invalid: "Поле '%{field}': ожидается тип '%{expected}', фактически '%{actual}'"
      summary_success: "Успешно: %{count}"
      summary_error: "Ошибки: %{count}"
      summary_warning: "Предупреждения: %{count}"
      summary_total: "Всего проверок: %{count}"
      status: "Статус"
      message: "Сообщение"
      project_found: "Проект найден: %{name}"
      project_not_found: "Проект не найден"
      project_not_selected: "Проект не выбран"
      author_found: "Автор найден: %{name}"
      author_not_found: "Автор не найден"
      author_not_selected: "Автор не выбран"
      tracker_found: "Трекер найден: %{name}"
      tracker_not_found: "Трекер не найден"
      tracker_not_selected: "Трекер не выбран"
      custom_fields_found: "Все необходимые кастомные поля найдены"
      custom_fields_missing: "Отсутствуют поля: %{fields}"
      field_not_found_short: "не найдено"
      general_error: "Ошибка тестирования: %{error}"

      # Для основных задач
      main_fields_available: "Все необходимые поля доступны для трекера основных задач"
      main_fields_not_available: "Поля недоступны для трекера '%{tracker}': %{fields}"

      # Для подзадач
      subtask_tracker_found: "Трекер подзадач найден: %{name}"
      subtask_tracker_not_found: "Трекер подзадач не найден"
      subtask_tracker_not_selected: "Трекер подзадач не выбран"
      subtask_fields_available: "Все необходимые поля доступны для трекера подзадач"
      subtask_fields_not_available: "Поля недоступны для трекера '%{tracker}': %{fields}"
      subtask_field_types_correct: "Типы полей для подзадач корректны"
      subtask_field_type_invalid: "Некорректный тип поля '%{field}': ожидается %{expected}, фактически %{actual}"

    # Rake-задачи
    rake:
      process_start: "=== Запуск обработки задач-шаблонов ==="
      start_time: "Время начала: %{time}"
      results: "Результаты выполнения"
      status: "Статус"
      issues_created: "Создано основных задач"
      subtasks_created: "Создано подзадач"
      errors_count: "Количество ошибок"
      error_details: "Детали ошибок:"
      end_time: "Время окончания: %{time}"
      duration: "Длительность: %{seconds} сек."
      critical_error: "=== КРИТИЧЕСКАЯ ОШИБКА ==="
      error_message: "Сообщение об ошибке"
      backtrace: "Трассировка:"
      test_start: "=== Тестирование настроек плагина ==="
      testing_settings: "Проверка настроек:"
      testing_custom_fields: "Проверка кастомных полей:"
      test_complete: "=== Тестирование завершено ==="
      test_error: "=== ОШИБКА ТЕСТИРОВАНИЯ ==="
      log_cleared: "Журнал логов очищен"
      log_not_found: "Файл журнала не найден"
      log_read_error: "Ошибка чтения журнала: %{error}"
      plugin_status: "=== Статус плагина ==="

    # Статусы
    status:
      success: "Успешно"
      error: "Ошибка"
      warning: "Предупреждение"
      info: "Информация"

    log:
      # Проект назначения
      project_field_not_configured: "Кастомное поле '%{field_name}' не настроено в плагине"
      project_field_empty: "Поле '%{field_name}' не заполнено в задаче-шаблоне"
      project_not_found: "В поле '%{field_name}' указан несуществующий проект (ID: %{field_value})"

      # Трекер назначения
      tracker_field_not_configured: "Кастомное поле '%{field_name}' не настроено в плагине"
      tracker_field_empty: "Поле '%{field_name}' не заполнено в задаче-шаблоне"
      tracker_not_found: "Трекер '%{tracker_name}' не найден в системе"
      tracker_not_in_project: "Трекер '%{tracker_name}' недоступен в проекте '%{project_name}'"

      # Группа назначения
      group_field_not_configured: "Кастомное поле '%{field_name}' не настроено в плагине"
      group_field_empty: "Поле '%{field_name}' не заполнено в задаче-шаблоне"
      group_not_found: "Группа '%{group_name}' не найдена в системе или не доступна в проекте"
      group_no_permissions: "Группа '%{group_name}' не имеет прав на редактирование задач в проекте"

      # Кастомные поля
      field_not_found: "Кастомное поле '%{field_name}' не найдено в системе"
      field_not_available: "Поле '%{field_name}' недоступно для трекера '%{tracker_name}'"
      required_field_missing: "Обязательное поле '%{field_name}' не заполнено в создаваемой задаче"

      # Создание задачи
      issue_creation_failed: "Не удалось создать задачу из-за ошибок валидации"
      issue_save_error: "Ошибка сохранения задачи: %{error}"

      # Подзадачи
      subtask_processing_failed: "Ошибка обработки подзадач - задача удалена"
      subtask_tracker_not_found: "Трекер подзадачи не найден в системе"
      subtask_tracker_mismatch: "Трекер подзадачи не соответствует настройкам (ожидался ID: %{expected}, фактически ID: %{actual})"
      subtask_save_error: "Ошибка сохранения подзадачи: %{error}"
      tracker_no_subtasks: "Выбранный трекер не поддерживает подзадачи"

      # Даты
      date_calculation_error: "Ошибка расчета даты следующего выполнения: %{error}"
      invalid_weekday_in_month: "Неверный день недели для месяца при расчете даты"
      month_without_day: "Месяц указан без числа при расчете даты"
      multiple_days_invalid_interval: "Нельзя указать несколько дней повторения при интервале больше 1 недели"
      next_date_update_failed: "Не удалось обновить дату следующего выполнения: %{error}"

      # Общие
      processing_started: "Запуск обработки задач-шаблонов"
      processing_template: "Обработка шаблона #%{issue_id}"
      template_processing_error: "Ошибка обработки шаблона: %{error}"
      settings_invalid: "Настройки плагина невалидны"
      no_templates_found: "Задачи-шаблоны для обработки не найдены"
      summary_success: "Обработка завершена. Создано задач: %{issues}, подзадач: %{subtasks}"
      summary_no_tasks: "Задачи не создавались"
      issue_created: "Создана задача #%{issue_id}: %{subject} %{subtasks}"
      with_subtasks: "(подзадач: %{count})"

      # Email
      email_not_configured: "Не настроен параметр mail_from в настройках Redmine"
      email_send_failed: "Ошибка отправки email: %{error}"
      email_sent_to_admin: "Email с отчётом об ошибках отправлен администратору %{admin} (%{email})"
      email_send_failed_to_admin: "Ошибка отправки email администратору %{admin}: %{error}"
      email_summary: "Отправка уведомлений завершена. Успешно: %{success}, Ошибок: %{errors}"

      # Наблюдатели
      notifications_sent: "Уведомления о создании задачи #%{issue_id} отправлены наблюдателям"
      notifications_disabled: "Отправка уведомлений отключена в настройках Redmine"
      notification_error: "Ошибка отправки уведомлений: %{error}"

      # Журнал
      empty: "Журнал пуст"
      read_error: "Ошибка чтения журнала: %{error}"

    # Email уведомления
    email:
      notification_subject: "[ЕЦСПК] Ошибки и предупреждения автоматизации задач "
