      select_user: "-- Выберите пользователя --"
      select_tracker: "-- Выберите трекер --"
      run_now_hint: "Запустит обработку всех задач-шаблонов немедленно"

      source_project_id: "Проект с шаблонами задач"
      source_project_hint: "ID проекта, в котором хранятся задачи-шаблоны"
      author_id: "Автор создаваемых задач"
      author_hint: "ID пользователя, который будет указан как автор"
