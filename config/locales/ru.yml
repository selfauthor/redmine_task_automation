      error_message: "Сообщение об ошибке"
      backtrace: "Трассировка:"
      test_start: "=== Тестирование настроек плагина ==="
      testing_settings: "Проверка настроек:"
      testing_custom_fields: "Проверка кастомных полей:"
      test_complete: "=== Тестирование завершено ==="
      test_error: "=== ОШИБКА ТЕСТИРОВАНИЯ ==="
      log_cleared: "Журнал логов очищен"
