ru:

 # Label для пункта меню
  label_task_automation: "Автоматизация задач"

  task_automation:
    # ... (предыдущие записи остаются)
    
    # Секции настроек
    settings:
      section_main: "Основные настройки"
      section_actions: "Действия"
      section_test_results: "Результаты тестирования"
