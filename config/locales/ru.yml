      error_notification_email: "Email для уведомлений об ошибках"
      email_hint: "Адрес электронной почты для получения отчётов об ошибках"

    # Кнопки
    buttons:
      save: "Сохранить"
      save_hint: "Сохраняет текущие настройки плагина в базу данных"
      test: "Тестировать"
      test_hint: "Проверяет корректность настроек: наличие проекта, пользователя, трекера и всех необходимых кастомных полей"
      run_now: "Запустить сейчас"
      run_now_hint: "Запускает немедленную обработку всех задач-шаблонов. Создаёт новые задачи на основе шаблонов, у которых подошла дата выполнения"
      clear_test_results: "Очистить результаты тестирования"

    # Сообщения flash
    flash:
      settings_saved: "Настройки успешно сохранены"
      settings_save_error: "Ошибка сохранения настроек: %{error}"
